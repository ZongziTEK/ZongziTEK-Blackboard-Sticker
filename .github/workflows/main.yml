name: Build and test
on:
  push:
    branches: [master, feature/duty-roster-blackboard]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build .NET Framework WPF application
        run: msbuild /restore /p:Configuration=Release /p:Platform="Any CPU"
      - name: Run duty roster, storage and layout checks
        run: dotnet run --project tests/DutyRosterTests/DutyRosterTests.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: Blackboard-Sticker-Windows
          path: ZongziTEK_Blackboard_Sticker/bin/Release/
          if-no-files-found: error
